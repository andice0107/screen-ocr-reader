name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file exe (PyInstaller --onefile)
        shell: pwsh
        run: |
          # 把 VC++ 執行階段一起包進去，沒裝過 VC++ 的電腦也能跑
          $extra = @()
          foreach ($dll in "msvcp140.dll","msvcp140_1.dll","vcruntime140.dll","vcruntime140_1.dll") {
            $p = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $p) { $extra += "--add-binary"; $extra += "$p;." }
          }
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name ScreenOCRReader `
            --icon assets/icon.ico `
            --add-data "assets/icon.ico;." `
            --collect-data rapidocr `
            --collect-submodules rapidocr `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            --exclude-module torch --exclude-module paddle --exclude-module openvino --exclude-module tensorrt `
            @extra `
            src/screen_ocr_reader.py
          Get-Item dist/ScreenOCRReader.exe | Select-Object Name, Length

      - name: Self-test the exe (OCR / screen grab / voices)
        shell: pwsh
        run: |
          $out = Join-Path $pwd "selftest.txt"
          $p = Start-Process -FilePath dist/ScreenOCRReader.exe -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content $out -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit $($p.ExitCode))" }

      - name: Smoke-test the window starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/ScreenOCRReader.exe -PassThru
          Start-Sleep -Seconds 25
          python -c "import mss; s=mss.MSS() if hasattr(mss,'MSS') else mss.mss(); s.shot(mon=-1, output='window-smoke.png')"
          $running = Get-Process -Name ScreenOCRReader -ErrorAction SilentlyContinue
          $log = Join-Path $env:APPDATA "ScreenOCRReader\error.log"
          if (Test-Path $log) { Get-Content $log }
          if (-not $running) { throw "app exited early" }
          Get-Process -Name ScreenOCRReader | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenOCRReader-windows
          path: |
            dist/ScreenOCRReader.exe
            selftest.txt
            window-smoke.png

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 截圖朗讀小幫手 v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            下載下面的 **ScreenOCRReader.exe**，雙擊就能用（免安裝）。
            第一次開啟若出現「Windows 已保護您的電腦」，請按「其他資訊」→「仍要執行」。

            使用說明請看 README。
          files: dist/ScreenOCRReader.exe
